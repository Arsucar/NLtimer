name: Build and Release

on:
  push:
    branches:
      - main
      - "feature/*"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - "feature/*"

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Updating APP_VERSION_NAME=$VERSION APP_VERSION_CODE=$VERSION_CODE"
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=$VERSION/" gradle.properties
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$VERSION_CODE/" gradle.properties
          
      - name: Configure Gradle JVM for CI
        run: |
          cat >> gradle.properties <<'EOF'

          # === CI Override (GitHub Actions) ===
          org.gradle.jvmargs=-Xmx5g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.workers.max=4
          EOF

      - name: Run detekt
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./gradlew detekt --stacktrace

      # 普通分支/PR 只检查编译，不打包
      - name: Compile Debug Sources
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./gradlew compileDebugSources --stacktrace

      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release-key.jks

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK (Signed)
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: app/build/outputs/apk/release/*.apk

      - name: Build & Upload Debug APK as Fallback
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 == ''
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Fallback APK
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Release APK
    needs: apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-env

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-env/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}